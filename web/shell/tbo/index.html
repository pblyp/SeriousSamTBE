<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serious Sam: The Both Encounters</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #000; color: #ddd; font: 16px/1.5 system-ui, sans-serif; }
  a { color: #fc0; }
</style>
</head>
<body>
<!-- The Both Encounters was here before it moved to the site's root: links to it (e.g. to a
     network game's room, ?join=...) go there, and its old service worker goes away -->
<p>The game has moved: <a id="moved" href="../">open it here</a>.</p>
<script>
  'use strict';
  const target = new URL(`../${location.search}${location.hash}`, location.href).href;
  document.getElementById('moved').href = target;
  const go = () => location.replace(target);
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistration('./')
      .then((registration) => (registration && new URL(registration.scope).pathname === location.pathname.replace(/[^/]*$/, '')
        ? registration.unregister() : null))
      .then(go, go);
  } else {
    go();
  }
</script>
</body>
</html>
